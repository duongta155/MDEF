[project]
name = "mdef"
version = "0.1.0"
description = "MDEF: Multi-Report Deep Ensemble Fusion for 3D CT Report Generation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "transformers>=4.40",
    "accelerate",
    "peft",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn",
    "scipy",
    "nltk",
    "rouge-score",
    "webdataset",
    "einops>=0.6",
    "vector-quantize-pytorch",
    "monai",
    "nibabel",
    "tqdm",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
gpu = [
    "flash-attn>=2.0",
    "bitsandbytes",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
